<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PowerCMS 12">
  <title>PowerCMS 12</title>
  <style>
    /* 与站点 token 对齐：--primary #2E5BFF / --ink-2 #12265C / 深色 accent #6FF0DC */
    .tile { fill: #2E5BFF; }
    .mark {
      fill: #FFFFFF;
      font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -1px;
    }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #12265C; }
      .mark { fill: #6FF0DC; }
    }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="14" class="tile"/>
  <text x="32" y="47" class="mark" text-anchor="middle">P</text>
</svg>
